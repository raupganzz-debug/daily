name: Daily Contribution

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node daily.mjs

      - name: Push to target
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/KurniawanSatria/daily.git target
          cp -r daily target/
          cd target
          git config user.name "KurniawanSatria"
          git config user.email "contact@saturia.codes"
          git add daily
          git diff --cached --quiet && exit 0
          git commit -m "chore: daily update"
          git push
