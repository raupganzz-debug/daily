<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#15151c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b2b35"/>
      <stop offset="50%" stop-color="#4a4a58"/>
      <stop offset="100%" stop-color="#2b2b35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="panelClip">
      <rect x="34" y="34" width="1132" height="692" rx="24"/>
    </clipPath>
    <style><![CDATA[
      @keyframes floatCard { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
      @keyframes pulseGlow { 0%,100%{opacity:.35} 50%{opacity:.85} }
      @keyframes sweep { 0%{transform:translateX(-260px);opacity:0} 15%{opacity:.55} 85%{opacity:.55} 100%{transform:translateX(1240px);opacity:0} }
      @keyframes barIn { from{transform:scaleX(0)} to{transform:scaleX(1)} }
      @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
      .cardA{animation:floatCard 4.5s ease-in-out infinite}
      .cardB{animation:floatCard 4.5s ease-in-out 1.2s infinite}
      .glow{animation:pulseGlow 3s ease-in-out infinite}
      .glow2{animation:pulseGlow 3s ease-in-out 1.2s infinite}
      .sweep{animation:sweep 5.5s linear infinite}
      .in{animation:fadeUp .8s ease-out both}
      .bar{transform-box:fill-box;transform-origin:left center;animation:barIn 1.25s cubic-bezier(.2,.7,.2,1) both}
      .d1{animation-delay:.05s}.d2{animation-delay:.2s}.d3{animation-delay:.35s}.d4{animation-delay:.5s}
    ]]></style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="#050507"/>
  <rect x="34" y="34" width="1132" height="692" rx="24" fill="url(#bg)" stroke="#25252e" filter="url(#shadow)"/>

  <g clip-path="url(#panelClip)">
    <rect class="glow" x="90" y="80" width="1020" height="560" rx="80" fill="#6d5cff" fill-opacity=".12" filter="url(#haze)"/>
    <g class="sweep"><rect x="0" y="40" width="220" height="3" rx="2" fill="#ffffff" opacity=".4"/></g>
  </g>

  <g class="in">
    <text x="80" y="92" fill="#f5f5f7" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700">AI Model Comparison</text>
    <text x="80" y="124" fill="#8e8e9a" font-family="Inter,Arial,sans-serif" font-size="16">Current comparison data · Artificial Analysis</text>
  </g>

  <g transform="translate(80 164)">
    <g class="cardA">
      <rect width="500" height="132" rx="18" fill="#101015" stroke="#292932"/>
      <circle class="glow" cx="52" cy="66" r="33" fill="none" stroke="#8b7cff" stroke-opacity=".5"/>
      <circle cx="52" cy="66" r="28" fill="#1d1d25" stroke="#3a3a47"/>
      <text x="52" y="74" text-anchor="middle" fill="#f3f3f5" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">M</text>
      <text x="96" y="56" fill="#f3f3f5" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Muse Spark 1.3 (max)</text>
      <text x="96" y="84" fill="#9b9ba7" font-family="Inter,Arial,sans-serif" font-size="15">Meta · Reasoning · 1M context</text>
      <text x="96" y="109" fill="#d4d4da" font-family="Inter,Arial,sans-serif" font-size="14">Intelligence Index: 48</text>
    </g>
  </g>

  <g transform="translate(620 164)">
    <g class="cardB">
      <rect width="500" height="132" rx="18" fill="#101015" stroke="#292932"/>
      <circle class="glow2" cx="52" cy="66" r="33" fill="none" stroke="#4fd1c5" stroke-opacity=".5"/>
      <circle cx="52" cy="66" r="28" fill="#1d1d25" stroke="#3a3a47"/>
      <text x="52" y="74" text-anchor="middle" fill="#f3f3f5" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">G</text>
      <text x="96" y="56" fill="#f3f3f5" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">GLM 5.3 Flash</text>
      <text x="96" y="84" fill="#9b9ba7" font-family="Inter,Arial,sans-serif" font-size="15">Z AI · Reasoning · 1M context</text>
      <text x="96" y="109" fill="#d4d4da" font-family="Inter,Arial,sans-serif" font-size="14">Intelligence Index: 42</text>
    </g>
  </g>

  <line x1="80" y1="330" x2="1120" y2="330" stroke="url(#line)"/>

  <text x="80" y="374" fill="#f0f0f3" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Performance</text>

  <g font-family="Inter,Arial,sans-serif">
    <text x="80" y="420" fill="#8e8e9a" font-size="14">Metric</text>
    <text x="520" y="420" fill="#8e8e9a" font-size="14">Muse Spark 1.3 (max)</text>
    <text x="850" y="420" fill="#8e8e9a" font-size="14">GLM 5.3 Flash</text>

    <line x1="80" y1="436" x2="1120" y2="436" stroke="#24242c"/>

    <text x="80" y="474" fill="#d7d7de" font-size="15">Output speed</text>
    <text x="520" y="474" fill="#f3f3f5" font-size="16" font-weight="700">200.9 tok/s</text>
    <text x="850" y="474" fill="#f3f3f5" font-size="16" font-weight="700">55.9 tok/s</text>
    <rect x="520" y="485" width="230" height="5" rx="3" fill="#24242c"/><rect class="bar d1" x="520" y="485" width="230" height="5" rx="3" fill="#8b7cff"/>
    <rect x="850" y="485" width="230" height="5" rx="3" fill="#24242c"/><rect class="bar d2" x="850" y="485" width="64" height="5" rx="3" fill="#4fd1c5"/>

    <text x="80" y="520" fill="#d7d7de" font-size="15">Time to first token</text>
    <text x="520" y="520" fill="#f3f3f5" font-size="16" font-weight="700">25.42 s</text>
    <text x="850" y="520" fill="#f3f3f5" font-size="16" font-weight="700">3.14 s</text>

    <text x="80" y="566" fill="#d7d7de" font-size="15">Price / 1M tokens</text>
    <text x="520" y="566" fill="#f3f3f5" font-size="16" font-weight="700">$0.78</text>
    <text x="850" y="566" fill="#f3f3f5" font-size="16" font-weight="700">$0.10</text>

    <text x="80" y="612" fill="#d7d7de" font-size="15">Context window</text>
    <text x="520" y="612" fill="#f3f3f5" font-size="16" font-weight="700">1.0M tokens</text>
    <text x="850" y="612" fill="#f3f3f5" font-size="16" font-weight="700">1.0M tokens</text>
  </g>

  <line x1="80" y1="650" x2="1120" y2="650" stroke="#24242c"/>
  <text x="80" y="684" fill="#777783" font-family="Inter,Arial,sans-serif" font-size="13">Source: Artificial Analysis · Values can change as providers and benchmarks update.</text>
  <text x="80" y="705" fill="#5f5f6a" font-family="Inter,Arial,sans-serif" font-size="12">https://artificialanalysis.ai/models/comparisons/muse-spark-1-3-vs-glm-5-3-flash</text>
</svg>
