<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d">
  <title id="t">GLM 5.3 Flash vs Muse Spark 1.3 (max)</title>
  <desc id="d">Muse Spark leads on intelligence index, both coding benchmarks, and output speed. GLM 5.3 Flash leads on time to first token and price, at roughly an eighth of the cost. Context window is equal at 1M tokens.</desc>
  <defs>
    <linearGradient id="metaGrad0" x1="75.897%" x2="26.312%" y1="89.199%" y2="12.194%"><stop offset=".06%" stop-color="#0867DF"/><stop offset="45.39%" stop-color="#0668E1"/><stop offset="85.91%" stop-color="#0064E0"/></linearGradient>
