      @media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--card:#141a22;--line:#232b35;--soft:#191f28;--ink:#eef4fa;--mute:#8a95a1;--track:#1f2630;--loser:#39424e;--win:#f4f8fc;--glm-bar:url(#gGlmD)}}
      text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
      .bgfill{fill:var(--bg)}
      .card{fill:var(--card);stroke:var(--line)}
      .name{font-size:23px;font-weight:800;fill:var(--ink);letter-spacing:-.2px}
      .sub{font-size:13px;fill:var(--mute)}
      .vs{font-size:14px;font-weight:700;fill:var(--mute);text-anchor:middle}
      .vsbadge{fill:var(--card);stroke:var(--line)}
      .lab{font-size:15px;font-weight:700;fill:var(--ink);text-anchor:middle;letter-spacing:.1px}
      .hint{font-size:11.5px;fill:var(--mute);text-anchor:middle}
      .num{font-size:26px;font-weight:800;letter-spacing:-.3px}
      .unit{font-size:12px;font-weight:600;fill:var(--mute)}
      .win{fill:var(--win)}
      .lose{fill:var(--mute)}
      .track{fill:var(--track)}
      .bar{transform-box:fill-box}
      .bm{fill:url(#gMuse)}
      .bar-glm{fill:var(--glm-bar)}
      .bn{fill:var(--loser)}
      .ink{fill:var(--ink)}
      .summary{font-size:15px;font-weight:600;fill:var(--ink);text-anchor:middle}
      .src{font-size:12px;fill:var(--mute);text-anchor:middle}
      .divider{stroke:var(--line)}
      .sumbox{fill:var(--soft);stroke:var(--line)}
      .acc-ink{fill:var(--ink);opacity:.85}
      .acc-muse{fill:var(--muse)}
      .sheen{pointer-events:none}
      .grow{animation:grow .9s cubic-bezier(.22,.85,.3,1) both}
      .l{transform-origin:100% 50%}
      .r{transform-origin:0% 50%}
      .fade{animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both}
      .drop{animation:dropIn .6s cubic-bezier(.2,.7,.3,1) both}
      .pop{animation:pop .5s cubic-bezier(.3,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
      .card{animation:cardIn .5s ease-out both}
      @keyframes grow{from{transform:scaleX(0)}}
      @keyframes fadeUp{from{opacity:0;transform:translateY(9px)}}
      @keyframes dropIn{from{opacity:0;transform:translateY(-12px)}}
      @keyframes pop{0%{opacity:0;transform:scale(.4)}60%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
      @keyframes cardIn{from{opacity:0;transform:translateY(8px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.sheen{display:none}}
    ]]></style>
